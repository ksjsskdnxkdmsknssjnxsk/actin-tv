<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="referrer" content="no-referrer">
    <title>Actin TV</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body, html {
            width: 100%;
            height: 100%;
            background-color: #0c0f12;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .video-container {
            position: relative;
            width: 100%;
            max-width: 100%;
            height: auto;
            aspect-ratio: 16 / 9; /* لتثبيت أبعاد الشاشة بالعرض الطبيعي */
            background: #000;
        }
        video {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }
        /* تأثير التغبيش الاحترافي الشفاف بالجهة اليمنى فوق */
        .blur-overlay {
            position: absolute;
            top: 15px;
            right: 15px;
            width: 140px;
            height: 55px;
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border-radius: 6px;
            z-index: 9;
            pointer-events: none;
        }
        /* اللوغو مالتك فوق الغواش بالتمام */
        .watermark {
            position: absolute;
            top: 15px;
            right: 15px;
            width: 140px;
            height: 55px;
            z-index: 10;
            pointer-events: none;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .watermark img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            filter: drop-shadow(0px 2px 4px rgba(0, 0, 0, 0.5));
        }
    </style>
</head>
<body>

    <div class="video-container">
        <!-- الغواش الشفاف المتناسق مالتنا -->
        <div class="blur-overlay"></div>

        <!-- اللوغو مالتك فوق الغواش بالتمام -->
        <div class="watermark">
            <img src="https://i.ibb.co/xtCkf7nW/image.png" alt="Actin Logo">
        </div>

        <!-- مشغل الفيديو -->
        <video id="video" controls autoplay playsinline></video>
    </div>

    <!-- مكتبة hls.js الرسمية والوحيدة لتشغيل الـ m3u8 -->
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <script>
        var video = document.getElementById('video');
        
        // الرابط الجديد مالتك مدمج بالكامل هنا
        var streamUrl = "https://s25-es17.s1q2105.com/hls2/dd7a90ae5dda935edd460ca8ede223b4/master.m3u8?token=d76f5902ce944e20393f49b406ddecaa-1784264872-169.224.96.192-bc66f3f577107d74611b9416cf6b05e125ce4c5b3914287595c3fd55062c257f";

        if (Hls.isSupported()) {
            var hls = new Hls({
                maxMaxBufferLength: 10,
                enableWorker: true
            });
            hls.loadSource(streamUrl);
            hls.attachMedia(video);
            hls.on(Hls.Events.MANIFEST_PARSED, function() {
                video.play().catch(function(e) {
                    console.log("التشغيل التلقائي يحتاج كبسة زر أولاً بسبب سياسة المتصفح.");
                });
            });
        } 
        else if (video.canPlayType('application/vnd.apple.mpegurl')) {
            video.src = streamUrl;
            video.addEventListener('loadedmetadata', function() {
                video.play();
            });
        }
    </script>
</body>
</html>
