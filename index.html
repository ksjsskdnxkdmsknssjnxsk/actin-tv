<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="referrer" content="no-referrer">
    <title>Actin TV</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body, html {
            width: 100%;
            height: 100%;
            background-color: #0c0f12;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .video-container {
            position: relative;
            width: 100%;
            height: 100%;
        }
        video {
            width: 100%;
            height: 100%;
            background: #000;
        }
        /* تأثير التغبيش الاحترافي - بالجهة اليمنى فوق ومكبر */
        .blur-overlay {
            position: absolute;
            top: 15px;
            right: 15px;
            width: 160px;
            height: 60px;
            background: rgba(0, 0, 0, 0.45);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border-radius: 8px;
            z-index: 9;
            pointer-events: none;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        /* اللوغو مالتك فوق التغبيش */
        .watermark {
            position: absolute;
            top: 18px;
            right: 25px;
            z-index: 10;
            pointer-events: none;
        }
        .watermark img {
            height: 54px;
            max-width: 140px;
            object-fit: contain;
            filter: drop-shadow(0px 4px 8px rgba(0, 0, 0, 0.6));
        }
    </style>
</head>
<body>

    <div class="video-container">
        <!-- التغبيش بالجهة اليمنى فوق ممتد ومكبر -->
        <div class="blur-overlay"></div>

        <!-- اللوغو مالتك فوق التغبيش مباشرة -->
        <div class="watermark">
            <img src="https://i.ibb.co/xtCkf7nW/image.png" alt="Actin Logo">
        </div>

        <!-- مشغل الفيديو -->
        <video id="video" controls autoplay playsinline></video>
    </div>

    <!-- مكتبة hls.js لتشغيل بثوث m3u8 و ts بأعلى كفاءة -->
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <script>
        var video = document.getElementById('video');
        
        // رابط البث الجديد الخاص بك مع التوكن الكامل
        var streamUrl = "http://45.155.90.183:7355/live/MMTVO89S7DY7CNV7SD/P7HIDSPCN580WXH90/181661.ts?token=SRRQUkALGw8bUAYBA1wGAVQCAw8GUgVTCVcBVAAGDAADBVxXV1pfBAkQSEcREERUVFw9XlIUCwEJV1UHBhoWRkFTSmxaBxsPGwNSXVpVDhMZExZeW1MTCgBRWwUFBAcAAQIUEUMKXRcDEFZcUVAPExkTB09CU0NeUAo8VVJAXVBXFAJdRg9VGRtdCjoGAVtQW1VADRQGExwTDxBBFQxaRl5aFBFRCk1HWEYBR1hGBAUAAEAbFFVeRV8SEUgVDBZydxQUEVYbTVBXQQ0KDEYME0FCQBsUX0JvQwMQRUVTVV5XRBoJEVMbGRtfBR09B1lfW1QBQ19ZX0MTXEEAAgYWHxBbV11aF1ZHZkINAUBeFAUEAlQVSw==";

        if (Hls.isSupported()) {
            var hls = new Hls({
                xhrSetup: function (xhr, url) {
                    xhr.withCredentials = false;
                }
            });
            hls.loadSource(streamUrl);
            hls.attachMedia(video);
            hls.on(Hls.Events.MANIFEST_PARSED, function() {
                video.play();
            });
        } 
        else if (video.canPlayType('application/vnd.apple.mpegurl')) {
            video.src = streamUrl;
            video.addEventListener('loadedmetadata', function() {
                video.play();
            });
        }
    </script>
</body>
</html>
