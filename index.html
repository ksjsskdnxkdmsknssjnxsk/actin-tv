<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="referrer" content="no-referrer">
    <title>Actin TV</title>
    <!-- Video.js CSS -->
    <link href="https://vjs.zencdn.net/8.10.0/video-js.css" rel="stylesheet" />
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body, html {
            width: 100%;
            height: 100%;
            background-color: #0c0f12;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .video-container {
            position: relative;
            width: 100%;
            height: 100%;
        }
        .video-js {
            width: 100% !important;
            height: 100% !important;
        }
        /* تأثير التغبيش */
        .blur-overlay {
            position: absolute;
            top: 15px;
            left: 15px;
            width: 130px;
            height: 45px;
            background: rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-radius: 6px;
            z-index: 9;
            pointer-events: none;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
    </style>
</head>
<body>

    <div class="video-container">
        <!-- التغبيش بالجهة اليسرى -->
        <div class="blur-overlay"></div>

        <!-- مشغل الفيديو -->
        <video id="actin-player" class="video-js vjs-default-skin vjs-big-play-button-centered" controls preload="auto">
            <p class="vjs-no-js">
                يرجى تفعيل جافا سكريبت لتشغيل البث.
            </p>
        </video>
    </div>

    <!-- Video.js JS -->
    <script src="https://vjs.zencdn.net/8.10.0/video.js"></script>
    <script>
        // رابط البث مالتك المباشر والصحيح بدون أي تلاعب بالرموز

        var player = videojs('actin-player', {
            fluid: true,
            controlBar: {
                pictureInPictureToggle: false

        });

        player.src({
            src: streamUrl,

        });

        player.ready(function() {
            player.play().catch(function(error) {
                console.log("Play failed, waiting for user interaction.");
            });
        });
    </script>
</body>
</html>
