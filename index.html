<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="referrer" content="no-referrer">
    <title>Actin TV</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body, html {
            width: 100%;
            height: 100%;
            background-color: #0c0f12;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .video-container {
            position: relative;
            width: 100%;
            max-width: 100%;
            height: auto;
            aspect-ratio: 16 / 9;
            background: #000;
        }
        video {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }
        /* تأثير التغبيش الاحترافي الشفاف */
        .blur-overlay {
            position: absolute;
            top: 15px;
            right: 15px;
            width: 140px;
            height: 55px;
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border-radius: 6px;
            z-index: 9;
            pointer-events: none;
        }
        /* اللوغو فوق الغواش بالتمام */
        .watermark {
            position: absolute;
            top: 15px;
            right: 15px;
            width: 140px;
            height: 55px;
            z-index: 10;
            pointer-events: none;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .watermark img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            filter: drop-shadow(0px 2px 4px rgba(0, 0, 0, 0.5));
        }
    </style>
</head>
<body>

    <div class="video-container">
        <div class="blur-overlay"></div>
        <div class="watermark">
            <img src="https://i.ibb.co/xtCkf7nW/image.png" alt="Actin Logo">
        </div>
        <video id="videoElement" controls autoplay playsinline></video>
    </div>

    <!-- استخدام المكتبة الرسمية لتشغيل ملفات الـ TS مباشرة -->
    <script src="https://cdn.jsdelivr.net/npm/mpegts.js@1.7.3/dist/mpegts.min.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function () {
            if (mpegts.getFeatureList().mseLivePlayback) {
                var videoElement = document.getElementById('videoElement');
                
                // الرابط المباشر الخاص بك
                var streamUrl = "http://45.155.90.183:7355/live/MMTVO89S7DY7CNV7SD/P7HIDSPCN580WXH90/181661.ts?token=SRRQUkALGw8bUAYBA1wGAVQCAw8GUgVTCVcBVAAGDAADBVxXV1pfBAkQSEcREERUVFw9XlIUCwEJV1UHBhoWRkFTSmxaBxsPGwNSXVpVDhMZExZeW1MTCgBRWwUFBAcAAQIUEUMKXRcDEFZcUVAPExkTB09CU0NeUAo8VVJAXVBXFAJdRg9VGRtdCjoGAVtQW1VADRQGExwTDxBBFQxaRl5aFBFRCk1HWEYBR1hGBAUAAEAbFFVeRV8SEUgVDBZydxQUEVYbTVBXQQ0KDEYME0FCQBsUX0JvQwMQRUVTVV5XRBoJEVMbGRtfBR09B1lfW1QBQ19ZX0MTXEEAAgYWHxBbV11aF1ZHZkINAUBeFAUEAlQVSw==";

                var player = mpegts.createPlayer({
                    type: 'mse', // لتشغيل بث الـ TS الحي
                    isLive: true,
                    url: streamUrl
                });
                
                player.attachMediaElement(videoElement);
                player.load();
                
                player.play().catch(function(error) {
                    console.log("التشغيل التلقائي واجه قيوداً؛ يحتاج ضغطة زر من المستخدم.");
                });
            }
        });
    </script>
</body>
</html>
