<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="referrer" content="no-referrer">
    <title>Actin TV</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body, html {
            width: 100%;
            height: 100%;
            background-color: #0c0f12;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .video-container {
            position: relative;
            width: 100%;
            max-width: 100%;
            height: auto;
            aspect-ratio: 16 / 9; /* تثبيت أبعاد الشاشة الطبيعية بالعرض */
            background: #000;
        }
        video {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }
        /* تأثير التغبيش الاحترافي الشفاف مطابق للوغو بالجهة اليمنى فوق */
        .blur-overlay {
            position: absolute;
            top: 15px;
            right: 15px;
            width: 140px; /* نفس عرض اللوغو مالتك */
            height: 55px; /* نفس ارتفاع اللوغو مالتك */
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border-radius: 6px;
            z-index: 9;
            pointer-events: none;
        }
        /* اللوغو مالتك فوق الغواش بالتمام */
        .watermark {
            position: absolute;
            top: 15px;
            right: 15px;
            width: 140px;
            height: 55px;
            z-index: 10;
            pointer-events: none;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .watermark img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            filter: drop-shadow(0px 2px 4px rgba(0, 0, 0, 0.5));
        }
    </style>
</head>
<body>

    <div class="video-container">
        <!-- الغواش الشفاف المتناسق مالتنا -->
        <div class="blur-overlay"></div>

        <!-- اللوغو مالتك فوق الغواش بالتمام -->
        <div class="watermark">
            <img src="https://i.ibb.co/xtCkf7nW/image.png" alt="Actin Logo">
        </div>

        <!-- مشغل الفيديو -->
        <video id="videoElement" controls autoplay playsinline></video>
    </div>

    <!-- مكاتب التشغيل المخصصة لروابط الـ ts المباشرة -->
    <script src="https://cdn.jsdelivr.net/npm/mpegts.js@1.7.3/dist/mpegts.min.js"></script>
    <script>
        if (mpegts.getFeatureList().mseLivePlayback) {
            var videoElement = document.getElementById('videoElement');
            
            // الرابط الأصلي مالتك
            var rawUrl = "https://s25-es17.s1q2105.com/hls2/dd7a90ae5dda935edd460ca8ede223b4/master.m3u8?token=d76f5902ce944e20393f49b406ddecaa-1784264872-169.224.96.192-bc66f3f577107d74611b9416cf6b05e125ce4c5b3914287595c3fd55062c257f";

            // هنا غلّفنا الرابط (التغليف البرمجي) لتحويله إلى HTTPS آمن وتخطي حظر المتصفح
            var proxyUrl = "https://images1-focus-opensocial.googleusercontent.com/gadgets/proxy?container=focus&refresh=1&url=" + encodeURIComponent(rawUrl);

            var player = mpegts.createPlayer({
                type: 'mse',
                isLive: true,
                url: proxyUrl // تشغيل البث عبر الرابط المغلّف
            });
            
            player.attachMediaElement(videoElement);
            player.load();
            player.play().catch(function(error) {
                console.log("التشغيل التلقائي يحتاج ضغطة زر من المستخدم أولاً بسبب سياسة المتصفح.");
            });
        }
    </script>
</body>
</html>
