<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="referrer" content="no-referrer">
    <title>Actin TV</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body, html {
            width: 100%;
            height: 100%;
            background-color: #0c0f12;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .video-container {
            position: relative;
            width: 100%;
            max-width: 100%;
            height: auto;
            aspect-ratio: 16 / 9;
            background: #000;
        }
        video {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }
        /* تأثير التغبيش الاحترافي الشفاف */
        .blur-overlay {
            position: absolute;
            top: 15px;
            right: 15px;
            width: 140px;
            height: 55px;
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border-radius: 6px;
            z-index: 9;
            pointer-events: none;
        }
        /* اللوغو مالتك فوق الغواش بالتمام */
        .watermark {
            position: absolute;
            top: 15px;
            right: 15px;
            width: 140px;
            height: 55px;
            z-index: 10;
            pointer-events: none;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .watermark img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            filter: drop-shadow(0px 2px 4px rgba(0, 0, 0, 0.5));
        }
    </style>
</head>
<body>

    <div class="video-container">
        <!-- الغواش الشفاف المتناسق -->
        <div class="blur-overlay"></div>

        <!-- اللوغو مالتك ممتد بالكامل فوق الغواش -->
        <div class="watermark">
            <img src="https://i.ibb.co/xtCkf7nW/image.png" alt="Actin Logo">
        </div>

        <!-- مشغل الفيديو -->
        <video id="video" controls autoplay playsinline></video>
    </div>

    <!-- مكتبة hls.js -->
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <script>
        var video = document.getElementById('video');
        
        // دمجنا رابط البث الجديد مالتك داخل البروكسي الآمن لتخطي حجب الـ HTTP والـ CORS
        var streamUrl = "https://streemkrdtv.site/api/hls-proxy?url=http%3A%2F%2F45.155.90.183%3A7355%2Flive%2FMMTVO89S7DY7CNV7SD%2FP7HIDSPCN580WXH90%2F181661.ts%3Ftoken%3DSRRQUkALGw8bUAYBA1wGAVQCAw8GUgVTCVcBVAAGDAADBVxXV1pfBAkQSEcREERUVFw9XlIUCwEJV1UHBhoWRkFTSmxaBxsPGwNSXVpVDhMZExZeW1MTCgBRWwUFBAcAAQIUEUMKXRcDEFZcUVAPExkTB09CU0NeUAo8VVJAXVBXFAJdRg9VGRtdCjoGAVtQW1VADRQGExwTDxBBFQxaRl5aFBFRCk1HWEYBR1hGBAUAAEAbFFVeRV8SEUgVDBZydxQUEVYbTVBXQQ0KDEYME0FCQBsUX0JvQwMQRUVTVV5XRBoJEVMbGRtfBR09B1lfW1QBQ19ZX0MTXEEAAgYWHxBbV11aF1ZHZkINAUBeFAUEAlQVSw%3D%3D";

        if (Hls.isSupported()) {
            var hls = new Hls({
                maxMaxBufferLength: 10,
                enableWorker: true
            });
            hls.loadSource(streamUrl);
            hls.attachMedia(video);
            hls.on(Hls.Events.MANIFEST_PARSED, function() {
                video.play().catch(function(e) {
                    console.log("التشغيل التلقائي يحتاج كبسة زر أولاً");
                });
            });
        } 
        else if (video.canPlayType('application/vnd.apple.mpegurl')) {
            video.src = streamUrl;
            video.addEventListener('loadedmetadata', function() {
                video.play();
            });
        }
    </script>
</body>
</html>
