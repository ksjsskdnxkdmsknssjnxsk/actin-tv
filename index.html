<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="referrer" content="no-referrer">
    <title>Actin TV</title>
    <!-- مكتبة مشغل Video.js -->
    <link href="https://vjs.zencdn.net/8.10.0/video-js.css" rel="stylesheet" />
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body, html {
            width: 100%;
            height: 100%;
            background-color: #0c0f12;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .video-container {
            position: relative;
            width: 100%;
            max-width: 100%;
            height: auto;
            aspect-ratio: 16 / 9;
            background: #000;
        }
        .video-js {
            width: 100% !important;
            height: 100% !important;
        }
        /* الغواش الشفاف بدون حواف سوداء ومطابق للوغو */
        .blur-overlay {
            position: absolute;
            top: 15px;
            right: 15px;
            width: 140px;
            height: 55px;
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border-radius: 6px;
            z-index: 9;
            pointer-events: none;
        }
        /* اللوغو ممتد فوق الغواش */
        .watermark {
            position: absolute;
            top: 15px;
            right: 15px;
            width: 140px;
            height: 55px;
            z-index: 10;
            pointer-events: none;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .watermark img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            filter: drop-shadow(0px 2px 4px rgba(0, 0, 0, 0.5));
        }
    </style>
</head>
<body>

    <div class="video-container">
        <!-- الغواش الشفاف المتناسق -->
        <div class="blur-overlay"></div>

        <!-- اللوغو مالتك فوق الغواش بالتمام -->
        <div class="watermark">
            <img src="https://i.ibb.co/xtCkf7nW/image.png" alt="Actin Logo">
        </div>

        <!-- مشغل الفيديو المعد لدعم ملفات الـ ts -->
        <video id="actin-player" class="video-js vjs-default-skin vjs-big-play-button-centered" controls autoplay playsinline preload="auto">
            <p class="vjs-no-js">تفعيل جافا سكريبت مطلوب لتشغيل البث.</p>
        </video>
    </div>

    <!-- المكاتب الأساسية: مشغل الفيديو ومحرك تحويل صيغة الـ ts بالوقت الفعلي -->
    <script src="https://vjs.zencdn.net/8.10.0/video.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/mux.js/6.0.1/mux.min.js"></script>
    <script>
        // رابط البث الـ ts مالتك ممرر عبر البروكسي الآمن لتفادي الحظر والـ CORS
        var streamUrl = "https://streemkrdtv.site/api/hls-proxy?url=http%3A%2F%2F45.155.90.183%3A7355%2Flive%2FMMTVO89S7DY7CNV7SD%2FP7HIDSPCN580WXH90%2F181661.ts%3Ftoken%3DSRRQUkALGw8bUAYBA1wGAVQCAw8GUgVTCVcBVAAGDAADBVxXV1pfBAkQSEcREERUVFw9XlIUCwEJV1UHBhoWRkFTSmxaBxsPGwNSXVpVDhMZExZeW1MTCgBRWwUFBAcAAQIUEUMKXRcDEFZcUVAPExkTB09CU0NeUAo8VVJAXVBXFAJdRg9VGRtdCjoGAVtQW1VADRQGExwTDxBBFQxaRl5aFBFRCk1HWEYBR1hGBAUAAEAbFFVeRV8SEUgVDBZydxQUEVYbTVBXQQ0KDEYME0FCQBsUX0JvQwMQRUVTVV5XRBoJEVMbGRtfBR09B1lfW1QBQ19ZX0MTXEEAAgYWHxBbV11aF1ZHZkINAUBeFAUEAlQVSw%3D%3D";

        // تهيئة المشغل
        var player = videojs('actin-player', {
            fluid: true,
            techOrder: ["html5"],
            html5: {
                hls: {
                    overrideNative: true
                }
            }
        });

        // تشغيل الرابط وتحديد نوعه كبث فيديو مباشر متوافق
        player.src({
            src: streamUrl,
            type: 'video/mp2t' // هذا السطر البرمجي يخبر المشغل بأن يتعامل معه كملف بث ts مباشرة
        });

        player.ready(function() {
            player.play().catch(function(error) {
                console.log("التشغيل التلقائي يحتاج ضغطة زر من المستخدم.");
            });
        });
    </script>
</body>
</html>
